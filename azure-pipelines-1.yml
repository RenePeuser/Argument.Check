# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

steps:

- script: dotnet tool install --global GitVersion.Tool --version 5.1.3
  displayName: 'dotnet tool install GitVersion.Tool'

- script:  ~/.dotnet/tools/dotnet-gitversion /output buildserver
  displayName: 'dotnet-gitversion'

- task: DotNetCoreCLI@2
  displayName: 'Build'
  inputs:
    command: 'build'
    projects: './src/Argument.Check.sln'

- task: DotNetCoreCLI@2
  displayName: 'Test'
  inputs:
    command: 'test'
    projects: './src/Argument.Check.sln'

- task: DotNetCoreCLI@2
  displayName: 'Pack'
  inputs:
    command: 'pack'
    packagesToPack: '**/*.csproj'
    includesymbols: true
    versioningScheme: 'byBuildNumber'

- task: DotNetCoreCLI@2
  displayName: 'Push to nuget-test'
  inputs:
    command: 'push'
    packagesToPush: '$(Build.ArtifactStagingDirectory)/*.nupkg'
    nuGetFeedType: 'internal'
    publishVstsFeed: '445b2d78-d8b7-46a4-9a0b-cb84f48e3178/0a086ad8-8e01-4ae2-91f0-16f85a115090'
