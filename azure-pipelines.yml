# ASP.NET Core
# Build and test ASP.NET Core projects targeting .NET Core.
# Add steps that run tests, create a NuGet package, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/dotnet-core

trigger:
- master

pool:
  vmImage: 'ubuntu-latest'

variables:
  buildConfiguration: 'Release'

steps:

- script: dotnet tool install --global GitVersion.Tool --version 5.1.3
  displayName: 'dotnet tool install GitVersion.Tool'

- script:  ~/.dotnet/tools/dotnet-gitversion /output buildserver
  displayName: 'dotnet-gitversion'

- script: dotnet build --configuration $(buildConfiguration) ./src/Argument.Check.sln
  displayName: 'dotnet build $(buildConfiguration)'

- script: dotnet test --configuration $(buildConfiguration) ./src/Argument.Check.sln
  displayName: 'dotnet test $(buildConfiguration)'

- task: DotNetCoreCLI@2
  displayName: dotnet pack
  inputs:
    command: pack
    packagesToPack: src/Argument.Check/Argument.Check.csproj
    versioningScheme: 'byBuildNumber'

- task: PublishBuildArtifacts@1
  displayName: 'publish artifacts'
  inputs:
    PathtoPublish: '$(build.artifactstagingdirectory)'
